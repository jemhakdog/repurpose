<!doctype html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}repurpose{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full text-slate-200">
  <nav class="border-b border-slate-800 bg-slate-900">
    <div class="mx-auto flex max-w-5xl items-center gap-6 px-4 py-3">
      <a href="{{ url_for('index') }}" class="font-bold text-white">repurpose</a>
      <a href="{{ url_for('index') }}" class="text-sm text-slate-400 hover:text-white">Jobs</a>
      <a href="{{ url_for('settings') }}" class="text-sm text-slate-400 hover:text-white">Settings</a>
      <span id="nav-status" class="ml-auto text-xs text-slate-500"></span>
    </div>
  </nav>

  <main class="mx-auto max-w-5xl px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <div id="toasts" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>
  <script>
    // 10-line toast helper (BUILD §2)
    function toast(msg, ok = true) {
      const el = document.createElement('div');
      el.className = 'rounded px-4 py-2 text-sm shadow-lg ' +
        (ok ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white');
      el.textContent = msg;
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
    async function post(url, body) {
      try {
        const r = await fetch(url, { method: 'POST', body });
        const j = await r.json();
        toast(j.msg || (j.ok ? 'OK' : 'Failed'), !!j.ok);
        return j;
      } catch (e) { toast(String(e), false); }
    }
    async function copyText(id, btn) {
      try {
        await navigator.clipboard.writeText(document.getElementById(id).value);
        toast('Copied');
      } catch (e) { toast(String(e), false); }
    }
    setInterval(async () => {
      try {
        const s = await (await fetch('/status')).json();
        document.getElementById('nav-status').textContent =
          `${s.jobs} jobs · ${s.pending} pending`;
      } catch (e) {}
    }, 2000);
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
